<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ACA Vector Lab">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#21152e">
  <title>ACA Vector Lab</title>
  <link data-trunk rel="copy-file" href="aca-mark.svg" />
  <link rel="icon" type="image/svg+xml" href="aca-mark.svg">
  <link data-trunk rel="rust" data-bin="vectorcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    /* iPad: no page scroll, bounce, pinch zoom, text selection or callout; the app takes the gestures. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #21152e;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
    /* Inside the safe areas (notch, home indicator) of a full-screen app. */
    #vectorcraft_canvas { position: absolute; top: env(safe-area-inset-top, 0); right: env(safe-area-inset-right, 0);
      bottom: env(safe-area-inset-bottom, 0); left: env(safe-area-inset-left, 0);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      display: block; touch-action: none; }
    #vectorcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #eadbb7; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
  <meta name="application-name" content="ALEJANDRO Creative Academy">
  <link data-trunk rel="copy-file" href="../../LICENSE-MIT" data-target-path="licenses" />
  <link data-trunk rel="copy-file" href="../../LICENSE-APACHE" data-target-path="licenses" />
  <link data-trunk rel="copy-file" href="../../NOTICE" data-target-path="licenses" />
  <link data-trunk rel="copy-file" href="../../ASSETS.md" data-target-path="licenses" />
<link data-trunk rel="copy-file" href="academy-bridge.js">
<script src="academy-bridge.js"></script>
</head>
<body>
  <canvas id="vectorcraft_canvas"></canvas>
  <div id="vectorcraft_loading">Loading ACA Vector Lab&hellip;</div>
</body>
</html>
